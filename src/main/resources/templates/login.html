<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Sign in')}"></head>
<body>
<main class="login card">
    <h1>Movie Admin</h1>
    <p class="hint">Sign in to edit movies.</p>
    <div class="alert alert-error" th:if="${param.error}" role="alert">Wrong username or password.</div>
    <div class="alert alert-success" th:if="${param.logout}" role="status">You have been signed out.</div>
    <form th:action="@{/login}" method="post">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <div class="actions"><button class="btn btn-primary" type="submit">Sign in</button></div>
    </form>
</main>
</body>
</html>
