spring:
  application:
    name: TrianglzMovieBackEnd
  docker:
    compose:
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/movies}
    username: ${DB_USERNAME:movies}
    password: ${DB_PASSWORD:movies}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    property-naming-strategy: SNAKE_CASE

app:
  tmdb:
    api-key: ${TMDB_API_KEY:}
    base-url: https://api.themoviedb.org/3
    sync-pages: ${TMDB_SYNC_PAGES:10}
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    topic: ${FCM_TOPIC:movie-updates}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}

management:
  endpoints:
    web:
      exposure:
        include: health
